# ============================================================================
# mp-v2 — nginx (functional-spec S7.2, architecture.md §9).
#
# Маршруты (дефолтный server, server_name _):
#   /healthz      — агрегированный health (статически, без проксирования);
#   /api/bff/*    — BFF Next.js (web:3000), без кэша;
#   /api/auth/*   — жёсткий rate-limit → Auth.js (web);
#   /api/*        — gateway:4000 (сохранение пути);
#   /media/*      — MinIO (только presigned-пути; префикс /media/ снимается);
#   /_next/static — статика Next.js (имя с хэшем → immutable);
#   /             — SSR-страницы web:3000.
#
# Домены UI (*.mp-kit.local, hosts → 127.0.0.1, порт 80 хоста):
#   portal.mp-kit.local / mp-kit.local — дефолтный server (→ web);
#   kibana.mp-kit.local                — Kibana (5601);
#   minio.mp-kit.local                 — консоль MinIO (9001);
#   mailpit.mp-kit.local               — Mailpit UI (8025);
#   rabbitmq.mp-kit.local              — RabbitMQ management (15672).
#   NB: во всех proxy Host = $http_host (С портом): без порта origin для
#   localhost:8080 становится localhost, и redirect_uri Auth.js неверен.
#
# X-Request-ID: единый источник — nginx (карта входящего или генерация);
# ответ upstream скрывается (proxy_hide_header), чтобы клиент получал
# ровно один заголовок (S7.2/8.1).
# ============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  json_access  escape=json
        '{"service":"nginx","time":"$time_iso8601","traceId":"$req_id",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"requestTime":$request_time,"upstreamResponseTime":"$upstream_response_time",'
        '"remoteAddr":"$remote_addr","userAgent":"$http_user_agent"}';

    access_log  /var/log/nginx/access.log  json_access;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # gzip только для проксируемых ответов работает с gzip_proxied (дефолт off —
    # иначе SSR/BFF-трафик не сжимается вовсе). woff2 убран: он уже сжат.
    gzip              on;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml image/svg+xml application/manifest+json;

    client_max_body_size  10m;

    # --- Upstream'и с keepalive: переиспользование TCP к сервисам ----------
    # Без этого каждый запрос — новое соединение (nginx шлёт Connection: close).
    # web пересоздаётся контейнером при каждом деплое (новый IP): nginx обязан
    # переразрешивать DNS на запрос — иначе после пересоздания держит старый IP
    # до рестарта и отдаёт 502 Bad Gateway. resolver + переменная вместо
    # статической upstream-группы (keepalive-группа для web больше не используется).
    resolver 127.0.0.11 ipv6=off valid=5s;

    upstream gateway_backend {
        server gateway:4000;
        keepalive 32;
    }

    upstream minio_backend {
        server minio:9000;
        keepalive 16;
    }

    upstream minio_console_backend {
        server minio:9001;
        keepalive 16;
    }

    upstream kibana_backend {
        server kibana:5601;
        keepalive 16;
    }

    upstream mailpit_backend {
        server mailpit:8025;
        keepalive 8;
    }

    upstream rabbitmq_management_backend {
        server rabbitmq:15672;
        keepalive 8;
    }

    # --- X-Request-ID (S7.2): берём входящий, иначе генерируем --------------
    map $http_x_request_id $req_id {
        default  $http_x_request_id;
        ""       $request_id;
    }

    # --- Rate-limit: жёсткий на auth, базовый на остальной API ---------------
    limit_req_zone  $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_status  429;
    limit_conn_status 429;

    # ==========================================================================
    # Дефолтный server: localhost, mp-kit.local, portal.mp-kit.local → web.
    # NB: $http_host (с портом) вместо $host — без порта origin для
    # localhost:8080 становится http://localhost, redirect_uri Auth.js ломается.
    # ==========================================================================
    server {
        listen  80;
        server_name  _;

        # Переменная вместо статической upstream: DNS web резолвится на каждый
        # запрос (resolver на уровне http) — деплой web не требует рестарта nginx
        set $web_upstream web:3000;

        # Заголовки ответа Next.js/Auth.js: session-кука чанкуется в set-cookie
        # по ~4 КБ (JWT с токенами) — дефолтный буфер 4–8 КБ даёт 502
        # "upstream sent too big header". 16 КБ с запасом.
        proxy_buffer_size  16k;
        proxy_buffers  4 16k;
        proxy_busy_buffers_size  16k;

        # --- Безопасность и trace-id в каждом ответе ------------------------
        add_header  X-Content-Type-Options  nosniff  always;
        add_header  X-Frame-Options  SAMEORIGIN  always;
        add_header  Referrer-Policy  strict-origin-when-cross-origin  always;
        add_header  X-Request-ID  $req_id  always;

        # --- Агрегированный health (без проксирования) ----------------------
        location = /healthz {
            access_log  off;
            default_type  text/plain;
            return  200 "ok\n";
        }

        # --- Статика Next.js: хэш в имени файла → можно кэшировать навсегда -
        location /_next/static/ {
            proxy_pass  http://$web_upstream;
            proxy_set_header  Host  $http_host;
            proxy_set_header  X-Request-ID  $req_id;
            proxy_hide_header  X-Request-ID;
            proxy_set_header  X-Real-IP  $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto  $scheme;
            proxy_set_header  X-Forwarded-Host  $http_host;
            proxy_http_version  1.1;
            proxy_set_header  Connection  "";
            expires    off;
            # Cache-Control и security-заголовки приходят и от Next.js —
            # скрываем upstream, чтобы клиент получал ровно один набор.
            proxy_hide_header  Cache-Control;
            # NB: add_header на уровне location отменяет ВСЕ серверные add_header
            # (security-заголовки и X-Request-ID) — повторяем их явно, иначе
            # статика отдаётся без них и без единого X-Request-ID (S7.2).
            add_header  Cache-Control  "public, immutable, max-age=31536000"  always;
            add_header  X-Content-Type-Options  nosniff  always;
            add_header  X-Frame-Options  SAMEORIGIN  always;
            add_header  Referrer-Policy  strict-origin-when-cross-origin  always;
            add_header  X-Request-ID  $req_id  always;
        }

        # --- BFF Next.js: агрегация для браузера, без кэша ------------------
        location /api/bff/ {
            limit_req  zone=api burst=120 nodelay;

            proxy_pass  http://$web_upstream;
            proxy_set_header  Host  $http_host;
            proxy_set_header  X-Request-ID  $req_id;
            proxy_hide_header  X-Request-ID;
            proxy_set_header  X-Real-IP  $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto  $scheme;
            proxy_set_header  X-Forwarded-Host  $http_host;
            proxy_http_version  1.1;
            proxy_set_header  Connection  "";
            proxy_read_timeout  60s;
            proxy_send_timeout  60s;
        }

        # --- Auth-эндпоинты Auth.js (web): жёсткий rate-limit ---------------
        # NB: /api/auth/* — это NextAuth (signin/callback/session), НЕ gateway:
        # браузерный OIDC-flow должен попадать в web (1.1).
        location /api/auth/ {
            limit_req  zone=api burst=60 nodelay;

            proxy_pass  http://$web_upstream;
            proxy_set_header  Host  $http_host;
            proxy_set_header  X-Request-ID  $req_id;
            proxy_hide_header  X-Request-ID;
            proxy_set_header  X-Real-IP  $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto  $scheme;
            proxy_set_header  X-Forwarded-Host  $http_host;
            proxy_http_version  1.1;
            proxy_set_header  Connection  "";
            proxy_read_timeout  60s;
            proxy_send_timeout  60s;
        }

        # --- Прямые вызовы API (страницы web их не используют) ---------------
        location /api/ {
            limit_req  zone=api burst=120 nodelay;

            proxy_pass  http://gateway_backend;
            proxy_set_header  Host  $http_host;
            proxy_set_header  X-Request-ID  $req_id;
            proxy_hide_header  X-Request-ID;
            proxy_set_header  X-Real-IP  $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto  $scheme;
            proxy_set_header  X-Forwarded-Host  $http_host;
            proxy_http_version  1.1;
            proxy_set_header  Connection  "";
            proxy_read_timeout  60s;
            proxy_send_timeout  60s;
        }

        # --- MinIO: presigned-пути (/media/ снимается, MinIO видит /bucket/..)
        location /media/ {
            proxy_pass  http://minio_backend/;
            proxy_set_header  Host  $http_host;
            proxy_set_header  X-Request-ID  $req_id;
            proxy_hide_header  X-Request-ID;
            proxy_set_header  X-Real-IP  $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_http_version  1.1;
            proxy_set_header  Connection  "";
            proxy_read_timeout  60s;
        }

        # --- SSR-страницы ----------------------------------------------------
        location / {
            proxy_pass  http://$web_upstream;
            proxy_set_header  Host  $http_host;
            proxy_set_header  X-Request-ID  $req_id;
            proxy_hide_header  X-Request-ID;
            proxy_set_header  X-Real-IP  $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto  $scheme;
            proxy_set_header  X-Forwarded-Host  $http_host;
            proxy_http_version  1.1;
            proxy_set_header  Connection  "";
            proxy_read_timeout  60s;
            proxy_send_timeout  60s;
        }
    }

    # ==========================================================================
    # Консоли UI-сервисов (*.mp-kit.local, hosts → 127.0.0.1:80).
    # Каждый блок — свой server_name; логирование json_access — глобальное.
    # ==========================================================================

    server {
        listen  80;
        server_name  kibana.mp-kit.local;

        proxy_buffer_size  16k;
        proxy_buffers  4 16k;

        add_header  X-Content-Type-Options  nosniff  always;
        add_header  X-Frame-Options  SAMEORIGIN  always;
        add_header  Referrer-Policy  strict-origin-when-cross-origin  always;
        add_header  X-Request-ID  $req_id  always;

        location / {
            proxy_pass  http://kibana_backend;
            proxy_set_header  Host  $http_host;
            proxy_set_header  X-Request-ID  $req_id;
            proxy_hide_header  X-Request-ID;
            proxy_set_header  X-Real-IP  $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto  $scheme;
            proxy_set_header  X-Forwarded-Host  $http_host;
            proxy_http_version  1.1;
            proxy_set_header  Connection  "";
            proxy_read_timeout  60s;
        }
    }

    server {
        listen  80;
        server_name  minio.mp-kit.local;

        proxy_buffer_size  16k;
        proxy_buffers  4 16k;

        add_header  X-Content-Type-Options  nosniff  always;
        add_header  X-Frame-Options  SAMEORIGIN  always;
        add_header  Referrer-Policy  strict-origin-when-cross-origin  always;
        add_header  X-Request-ID  $req_id  always;

        # Консоль MinIO (9001): UI + её API на том же порту
        location / {
            proxy_pass  http://minio_console_backend;
            proxy_set_header  Host  $http_host;
            proxy_set_header  X-Request-ID  $req_id;
            proxy_hide_header  X-Request-ID;
            proxy_set_header  X-Real-IP  $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto  $scheme;
            proxy_set_header  X-Forwarded-Host  $http_host;
            proxy_http_version  1.1;
            proxy_set_header  Connection  "";
            proxy_read_timeout  300s;
        }
    }

    server {
        listen  80;
        server_name  mailpit.mp-kit.local;

        add_header  X-Content-Type-Options  nosniff  always;
        add_header  X-Frame-Options  SAMEORIGIN  always;
        add_header  Referrer-Policy  strict-origin-when-cross-origin  always;
        add_header  X-Request-ID  $req_id  always;

        location / {
            proxy_pass  http://mailpit_backend;
            proxy_set_header  Host  $http_host;
            proxy_set_header  X-Request-ID  $req_id;
            proxy_hide_header  X-Request-ID;
            proxy_set_header  X-Real-IP  $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto  $scheme;
            proxy_set_header  X-Forwarded-Host  $http_host;
            proxy_http_version  1.1;
            proxy_set_header  Connection  "";
            proxy_read_timeout  60s;
        }
    }

    server {
        listen  80;
        server_name  rabbitmq.mp-kit.local;

        add_header  X-Content-Type-Options  nosniff  always;
        add_header  X-Frame-Options  SAMEORIGIN  always;
        add_header  Referrer-Policy  strict-origin-when-cross-origin  always;
        add_header  X-Request-ID  $req_id  always;

        location / {
            proxy_pass  http://rabbitmq_management_backend;
            proxy_set_header  Host  $http_host;
            proxy_set_header  X-Request-ID  $req_id;
            proxy_hide_header  X-Request-ID;
            proxy_set_header  X-Real-IP  $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto  $scheme;
            proxy_set_header  X-Forwarded-Host  $http_host;
            proxy_http_version  1.1;
            proxy_set_header  Connection  "";
            proxy_read_timeout  60s;
        }
    }
}
