# ============================================================================
# mp-v2 вЂ” nginx (functional-spec S7.2, architecture.md В§9).
#
# РњР°СЂС€СЂСѓС‚С‹:
#   /healthz      вЂ” Р°РіСЂРµРіРёСЂРѕРІР°РЅРЅС‹Р№ health (СЃС‚Р°С‚РёС‡РµСЃРєРё, Р±РµР· РїСЂРѕРєСЃРёСЂРѕРІР°РЅРёСЏ);
#   /api/bff/*    вЂ” BFF Next.js (web:3000), Р±РµР· РєСЌС€Р°;
#   /api/auth/*   вЂ” Р¶С‘СЃС‚РєРёР№ rate-limit в†’ gateway:4000;
#   /api/*        вЂ” gateway:4000 (СЃРѕС…СЂР°РЅРµРЅРёРµ РїСѓС‚Рё);
#   /media/*      вЂ” MinIO (С‚РѕР»СЊРєРѕ presigned-РїСѓС‚Рё; РїСЂРµС„РёРєСЃ /media/ СЃРЅРёРјР°РµС‚СЃСЏ);
#   /_next/static вЂ” СЃС‚Р°С‚РёРєР° Next.js (РёРјСЏ СЃ С…СЌС€РµРј в†’ immutable);
#   /             вЂ” SSR-СЃС‚СЂР°РЅРёС†С‹ web:3000.
#
# X-Request-ID: РµРґРёРЅС‹Р№ РёСЃС‚РѕС‡РЅРёРє вЂ” nginx (РєР°СЂС‚Р° РІС…РѕРґСЏС‰РµРіРѕ РёР»Рё РіРµРЅРµСЂР°С†РёСЏ);
# РѕС‚РІРµС‚ upstream СЃРєСЂС‹РІР°РµС‚СЃСЏ (proxy_hide_header), С‡С‚РѕР±С‹ РєР»РёРµРЅС‚ РїРѕР»СѓС‡Р°Р»
# СЂРѕРІРЅРѕ РѕРґРёРЅ Р·Р°РіРѕР»РѕРІРѕРє (S7.2/8.1).
# ============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  json_access  escape=json
        '{"service":"nginx","time":"$time_iso8601","traceId":"$req_id",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"requestTime":$request_time,"upstreamResponseTime":"$upstream_response_time",'
        '"remoteAddr":"$remote_addr","userAgent":"$http_user_agent"}';

    access_log  /var/log/nginx/access.log  json_access;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # gzip С‚РѕР»СЊРєРѕ РґР»СЏ РїСЂРѕРєСЃРёСЂСѓРµРјС‹С… РѕС‚РІРµС‚РѕРІ СЂР°Р±РѕС‚Р°РµС‚ СЃ gzip_proxied (РґРµС„РѕР»С‚ off вЂ”
    # РёРЅР°С‡Рµ SSR/BFF-С‚СЂР°С„РёРє РЅРµ СЃР¶РёРјР°РµС‚СЃСЏ РІРѕРІСЃРµ). woff2 СѓР±СЂР°РЅ: РѕРЅ СѓР¶Рµ СЃР¶Р°С‚.
    gzip              on;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml image/svg+xml application/manifest+json;

    client_max_body_size  10m;

    # --- Upstream'Рё СЃ keepalive: РїРµСЂРµРёСЃРїРѕР»СЊР·РѕРІР°РЅРёРµ TCP Рє СЃРµСЂРІРёСЃР°Рј ----------
    # Р‘РµР· СЌС‚РѕРіРѕ РєР°Р¶РґС‹Р№ Р·Р°РїСЂРѕСЃ вЂ” РЅРѕРІРѕРµ СЃРѕРµРґРёРЅРµРЅРёРµ (nginx С€Р»С‘С‚ Connection: close).
    upstream web_backend {
        server web:3000;
        keepalive 32;
    }

    upstream gateway_backend {
        server gateway:4000;
        keepalive 32;
    }

    upstream minio_backend {
        server minio:9000;
        keepalive 16;
    }

    # --- X-Request-ID (S7.2): Р±РµСЂС‘Рј РІС…РѕРґСЏС‰РёР№, РёРЅР°С‡Рµ РіРµРЅРµСЂРёСЂСѓРµРј --------------
    map $http_x_request_id $req_id {
        default  $http_x_request_id;
        ""       $request_id;
    }

    # --- Rate-limit: Р¶С‘СЃС‚РєРёР№ РЅР° auth, Р±Р°Р·РѕРІС‹Р№ РЅР° РѕСЃС‚Р°Р»СЊРЅРѕР№ API ---------------
    limit_req_zone  $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_status  429;
    limit_conn_status 429;

    server {
        listen  80;
        server_name  _;

        # Р—Р°РіРѕР»РѕРІРєРё РѕС‚РІРµС‚Р° Next.js/Auth.js: session-РєСѓРєР° С‡Р°РЅРєСѓРµС‚СЃСЏ РІ set-cookie
        # РїРѕ ~4 РљР‘ (JWT СЃ С‚РѕРєРµРЅР°РјРё) вЂ” РґРµС„РѕР»С‚РЅС‹Р№ Р±СѓС„РµСЂ 4вЂ“8 РљР‘ РґР°С‘С‚ 502
        # "upstream sent too big header". 16 РљР‘ СЃ Р·Р°РїР°СЃРѕРј.
        proxy_buffer_size  16k;
        proxy_buffers  4 16k;
        proxy_busy_buffers_size  16k;

        # --- Р‘РµР·РѕРїР°СЃРЅРѕСЃС‚СЊ Рё trace-id РІ РєР°Р¶РґРѕРј РѕС‚РІРµС‚Рµ ------------------------
        add_header  X-Content-Type-Options  nosniff  always;
        add_header  X-Frame-Options  SAMEORIGIN  always;
        add_header  Referrer-Policy  strict-origin-when-cross-origin  always;
        add_header  X-Request-ID  $req_id  always;

        # --- РђРіСЂРµРіРёСЂРѕРІР°РЅРЅС‹Р№ health (Р±РµР· РїСЂРѕРєСЃРёСЂРѕРІР°РЅРёСЏ) ----------------------
        location = /healthz {
            access_log  off;
            default_type  text/plain;
            return  200 "ok\n";
        }

        # --- РЎС‚Р°С‚РёРєР° Next.js: С…СЌС€ РІ РёРјРµРЅРё С„Р°Р№Р»Р° в†’ РјРѕР¶РЅРѕ РєСЌС€РёСЂРѕРІР°С‚СЊ РЅР°РІСЃРµРіРґР° -
        location /_next/static/ {
            proxy_pass  http://web_backend;
            proxy_set_header  Host  $http_host;
            proxy_set_header  X-Request-ID  $req_id;
            proxy_hide_header  X-Request-ID;
            proxy_set_header  X-Real-IP  $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto  $scheme;
            proxy_http_version  1.1;
            proxy_set_header  Connection  "";
            expires    off;
            # Cache-Control Рё security-Р·Р°РіРѕР»РѕРІРєРё РїСЂРёС…РѕРґСЏС‚ Рё РѕС‚ Next.js вЂ”
            # СЃРєСЂС‹РІР°РµРј upstream, С‡С‚РѕР±С‹ РєР»РёРµРЅС‚ РїРѕР»СѓС‡Р°Р» СЂРѕРІРЅРѕ РѕРґРёРЅ РЅР°Р±РѕСЂ.
            proxy_hide_header  Cache-Control;
            # NB: add_header РЅР° СѓСЂРѕРІРЅРµ location РѕС‚РјРµРЅСЏРµС‚ Р’РЎР• СЃРµСЂРІРµСЂРЅС‹Рµ add_header
            # (security-Р·Р°РіРѕР»РѕРІРєРё Рё X-Request-ID) вЂ” РїРѕРІС‚РѕСЂСЏРµРј РёС… СЏРІРЅРѕ, РёРЅР°С‡Рµ
            # СЃС‚Р°С‚РёРєР° РѕС‚РґР°С‘С‚СЃСЏ Р±РµР· РЅРёС… Рё Р±РµР· РµРґРёРЅРѕРіРѕ X-Request-ID (S7.2).
            add_header  Cache-Control  "public, immutable, max-age=31536000"  always;
            add_header  X-Content-Type-Options  nosniff  always;
            add_header  X-Frame-Options  SAMEORIGIN  always;
            add_header  Referrer-Policy  strict-origin-when-cross-origin  always;
            add_header  X-Request-ID  $req_id  always;
        }

        # --- BFF Next.js: Р°РіСЂРµРіР°С†РёСЏ РґР»СЏ Р±СЂР°СѓР·РµСЂР°, Р±РµР· РєСЌС€Р° ------------------
        location /api/bff/ {
            limit_req  zone=api burst=120 nodelay;

            proxy_pass  http://web_backend;
            proxy_set_header  Host  $http_host;
            proxy_set_header  X-Request-ID  $req_id;
            proxy_hide_header  X-Request-ID;
            proxy_set_header  X-Real-IP  $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto  $scheme;
            proxy_http_version  1.1;
            proxy_set_header  Connection  "";
            proxy_read_timeout  60s;
            proxy_send_timeout  60s;
        }

        # --- Auth-СЌРЅРґРїРѕРёРЅС‚С‹ Auth.js (web): Р¶С‘СЃС‚РєРёР№ rate-limit ---------------
        # NB: /api/auth/* вЂ” СЌС‚Рѕ NextAuth (signin/callback/session), РќР• gateway:
        # Р±СЂР°СѓР·РµСЂРЅС‹Р№ OIDC-flow РґРѕР»Р¶РµРЅ РїРѕРїР°РґР°С‚СЊ РІ web (1.1).
        location /api/auth/ {
            limit_req  zone=api burst=60 nodelay;

            proxy_pass  http://web_backend;
            proxy_set_header  Host  $http_host;
            proxy_set_header  X-Request-ID  $req_id;
            proxy_hide_header  X-Request-ID;
            proxy_set_header  X-Real-IP  $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto  $scheme;
            proxy_http_version  1.1;
            proxy_set_header  Connection  "";
            proxy_read_timeout  60s;
            proxy_send_timeout  60s;
        }

        # --- РџСЂСЏРјС‹Рµ РІС‹Р·РѕРІС‹ API (СЃС‚СЂР°РЅРёС†С‹ web РёС… РЅРµ РёСЃРїРѕР»СЊР·СѓСЋС‚) ---------------
        location /api/ {
            limit_req  zone=api burst=120 nodelay;

            proxy_pass  http://gateway_backend;
            proxy_set_header  Host  $http_host;
            proxy_set_header  X-Request-ID  $req_id;
            proxy_hide_header  X-Request-ID;
            proxy_set_header  X-Real-IP  $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto  $scheme;
            proxy_http_version  1.1;
            proxy_set_header  Connection  "";
            proxy_read_timeout  60s;
            proxy_send_timeout  60s;
        }

        # --- MinIO: presigned-РїСѓС‚Рё (/media/ СЃРЅРёРјР°РµС‚СЃСЏ, MinIO РІРёРґРёС‚ /bucket/..)
        location /media/ {
            proxy_pass  http://minio_backend/;
            proxy_set_header  Host  $http_host;
            proxy_set_header  X-Request-ID  $req_id;
            proxy_hide_header  X-Request-ID;
            proxy_set_header  X-Real-IP  $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_http_version  1.1;
            proxy_set_header  Connection  "";
            proxy_read_timeout  60s;
        }

        # --- SSR-СЃС‚СЂР°РЅРёС†С‹ ----------------------------------------------------
        location / {
            proxy_pass  http://web_backend;
            proxy_set_header  Host  $http_host;
            proxy_set_header  X-Request-ID  $req_id;
            proxy_hide_header  X-Request-ID;
            proxy_set_header  X-Real-IP  $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto  $scheme;
            proxy_http_version  1.1;
            proxy_set_header  Connection  "";
            proxy_read_timeout  60s;
            proxy_send_timeout  60s;
        }
    }
}
