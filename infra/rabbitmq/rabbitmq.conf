# mp-v2 — конфигурация RabbitMQ (задачи 0.3 / 0.9).
# NB: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS c load_definitions падал на
# rabbitmq:4.1 с bad_environment_value — используем документированный
# rabbitmq.conf (см. отчёт по отклонениям).

# guest (из .env) должен работать из compose-сети, а не только с loopback:
loopback_users.guest = false

# Идемпотентные объявления при каждом старте: exchange medical.events,
# medical.dlx и др. (см. definitions.json). Очереди создаёт сервисы сами.
management.load_definitions = /etc/rabbitmq/definitions.json
