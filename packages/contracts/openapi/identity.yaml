openapi: 3.1.0
info:
  title: mp-v2 identity
  version: 0.1.0
  description: "Сгенерировано из Zod-схем packages/contracts. Перегенерация: pnpm
    gen. Сервис: identity, операций: 7."
paths:
  /api/identity/register:
    post:
      tags:
        - identity
      summary: "Регистрация (сага: Keycloak + карточка пациента)"
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: "Успех:"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Нет/просрочен токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Конфликт (запись занята, дубликат, уже обработано и т.п.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/identity/doctors:
    post:
      tags:
        - identity
      summary: Сага врача с учётной записью DOCTOR (9.1, только ADMIN)
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDoctorRequest"
      responses:
        "200":
          description: "Успех:"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterDoctorResponse"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Нет/просрочен токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Конфликт (запись занята, дубликат, уже обработано и т.п.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/identity/doctors/:doctorId/account:
    post:
      tags:
        - identity
      summary: Создать учётную запись для существующего врача и привязать (только ADMIN)
      parameters:
        - name: doctorId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDoctorAccountRequest"
      responses:
        "200":
          description: "Успех:"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDoctorAccountResponse"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Нет/просрочен токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Конфликт (запись занята, дубликат, уже обработано и т.п.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/identity/me:
    get:
      tags:
        - identity
      summary: "Профиль текущего пользователя (10.1: email/ФИО из Keycloak)"
      parameters: []
      responses:
        "200":
          description: "Успех:"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeProfile"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Нет/просрочен токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      tags:
        - identity
      summary: "Правка своих данных (10.1: email/ФИО, занятый email → 409)"
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: "Успех:"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeProfile"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Нет/просрочен токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/identity/users/:userId:
    get:
      tags:
        - identity
      summary: "Профиль пользователя для админки (3.2: email врача, только ADMIN)"
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Успех:"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserProfile"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Нет/просрочен токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      tags:
        - identity
      summary: Правка профиля пользователя админом (email; занятый → 409)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminUserProfileRequest"
      responses:
        "200":
          description: "Успех:"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserProfile"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Нет/просрочен токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    ApiError:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        field:
          type: string
          minLength: 1
        requestId:
          type: string
          minLength: 1
      required:
        - code
        - message
    PaginationQuery:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        offset:
          default: 0
          type: integer
          minimum: 0
          maximum: 9007199254740991
        limit:
          default: 20
          type: integer
          minimum: 1
          maximum: 100
    Ok:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        ok:
          type: boolean
          const: true
      required:
        - ok
    RegisterRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        password:
          type: string
          minLength: 8
          maxLength: 72
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        middleName:
          type: string
          minLength: 1
          maxLength: 100
        birthDate:
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
      required:
        - email
        - password
        - firstName
        - lastName
        - birthDate
    RegisterResponse:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        userId:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
      required:
        - userId
        - email
    RegisterDoctorRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        password:
          type: string
          minLength: 8
          maxLength: 72
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        middleName:
          type: string
          minLength: 1
          maxLength: 100
        specializationId:
          type: string
          minLength: 1
        schedule:
          type: object
          properties:
            startTime:
              type: string
              pattern: ^\d{2}:\d{2}$
            endTime:
              type: string
              pattern: ^\d{2}:\d{2}$
            durationMinutes:
              type: integer
              minimum: 5
              maximum: 30
            workDays:
              minItems: 1
              type: array
              items:
                type: integer
                minimum: 1
                maximum: 7
          required:
            - startTime
            - endTime
            - durationMinutes
            - workDays
      required:
        - email
        - password
        - firstName
        - lastName
        - specializationId
        - schedule
    RegisterDoctorResponse:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        userId:
          type: string
          minLength: 1
        doctorId:
          type: string
          minLength: 1
      required:
        - userId
        - doctorId
    CreateDoctorAccountRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        password:
          type: string
          minLength: 8
          maxLength: 72
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        middleName:
          type: string
          minLength: 1
          maxLength: 100
      required:
        - email
        - password
        - firstName
        - lastName
    CreateDoctorAccountResponse:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        userId:
          type: string
          minLength: 1
      required:
        - userId
    MeProfile:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        firstName:
          type: string
        lastName:
          type: string
        roles:
          type: array
          items:
            type: string
      required:
        - email
        - firstName
        - lastName
        - roles
    UpdateMeRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
    AdminUserProfile:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        userId:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        firstName:
          type: string
        lastName:
          type: string
      required:
        - userId
        - email
        - firstName
        - lastName
    UpdateAdminUserProfileRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
      required:
        - email
