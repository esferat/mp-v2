            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
        - name: to
          in: query
          required: true
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            type: string
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
        - name: startTime
          in: query
          required: false
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            type: string
            pattern: ^\d{2}:\d{2}$
        - name: endTime
          in: query
          required: false
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            type: string
            pattern: ^\d{2}:\d{2}$
        - name: includeBusy
          in: query
          required: false
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            type: string
            enum:
              - "1"
      responses:
        "200":
          description: "Успех:"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SlotList"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Нет/просрочен токен
          content:
