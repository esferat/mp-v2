openapi: 3.1.0
info:
  title: mp-v2 file
  version: 0.1.0
  description: "Сгенерировано из Zod-схем packages/contracts. Перегенерация: pnpm
    gen. Сервис: file, операций: 4."
paths:
  /api/files:
    get:
      tags:
        - file
      summary: "Список файлов владельца (4.5/9.3: владелец или ADMIN)"
      parameters:
        - name: offset
          in: query
          required: false
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            default: 0
            type: integer
            minimum: 0
            maximum: 9007199254740991
        - name: limit
          in: query
          required: false
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            default: 20
            type: integer
            minimum: 1
            maximum: 100
        - name: ownerType
          in: query
          required: true
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            type: string
            enum:
              - PATIENT
              - DOCTOR
        - name: ownerId
          in: query
          required: true
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            type: string
            minLength: 1
      responses:
        "200":
          description: "Успех:"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileListResponse"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Нет/просрочен токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/files/upload:
    post:
      tags:
        - file
      summary: Загрузка файла (multipart, валидация MIME/размера)
      parameters: []
      responses:
        "200":
          description: "Успех:"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadFileResponse"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Нет/просрочен токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Конфликт (запись занята, дубликат, уже обработано и т.п.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/files/:key:
    get:
      tags:
        - file
      summary: Presigned URL на скачивание (TTL 5 мин)
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Успех:"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileDownload"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Нет/просрочен токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
        - file
      summary: Удалить файл (владелец или ADMIN, 4.4)
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Успех:"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Нет/просрочен токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    ApiError:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        field:
          type: string
          minLength: 1
        requestId:
          type: string
          minLength: 1
      required:
        - code
        - message
    PaginationQuery:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        offset:
          default: 0
          type: integer
          minimum: 0
          maximum: 9007199254740991
        limit:
          default: 20
          type: integer
          minimum: 1
          maximum: 100
    Ok:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        ok:
          type: boolean
          const: true
      required:
        - ok
    FileListResponse:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                minLength: 1
              ownerType:
                type: string
                enum:
                  - PATIENT
                  - DOCTOR
              ownerId:
                type: string
                minLength: 1
              mime:
                type: string
                minLength: 1
              size:
                type: integer
                minimum: 0
                maximum: 9007199254740991
              uploadedBy:
                type: string
                minLength: 1
              category:
                type: string
                enum:
                  - ANALYSIS
                  - REFERRAL
                  - DISCHARGE
                  - OTHER
              createdAt:
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
            required:
              - key
              - ownerType
              - ownerId
              - mime
              - size
              - uploadedBy
              - createdAt
        total:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - items
        - total
    FileListQuery:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        offset:
          default: 0
          type: integer
          minimum: 0
          maximum: 9007199254740991
        limit:
          default: 20
          type: integer
          minimum: 1
          maximum: 100
        ownerType:
          type: string
          enum:
            - PATIENT
            - DOCTOR
        ownerId:
          type: string
          minLength: 1
      required:
        - ownerType
        - ownerId
    UploadFileResponse:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        key:
          type: string
          minLength: 1
        bucket:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        mime:
          type: string
          minLength: 1
      required:
        - key
        - bucket
        - size
        - mime
    FileDownload:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        url:
          type: string
          format: uri
        expiresInSeconds:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      required:
        - url
        - expiresInSeconds
