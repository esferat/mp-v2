openapi: 3.1.0
info:
  title: mp-v2 catalog
  version: 0.1.0
  description: "Сгенерировано из Zod-схем packages/contracts. Перегенерация: pnpm
    gen. Сервис: catalog, операций: 10."
paths:
  /api/catalog/doctors:
    get:
      tags:
        - catalog
      summary: Список врачей с поиском и пагинацией
      parameters:
        - name: offset
          in: query
          required: false
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            default: 0
            type: integer
            minimum: 0
            maximum: 9007199254740991
        - name: limit
          in: query
          required: false
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            default: 20
            type: integer
            minimum: 1
            maximum: 100
        - name: search
          in: query
          required: false
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            type: string
            minLength: 1
        - name: status
          in: query
          required: false
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            type: string
            enum:
              - ACTIVE
              - INACTIVE
        - name: specId
          in: query
          required: false
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            type: string
            minLength: 1
      responses:
        "200":
          description: "Успех:"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorListResponse"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Нет/просрочен токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
        - catalog
      summary: Создать врача с расписанием
      parameters: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDoctorRequest"
      responses:
        "200":
          description: "Успех:"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorListItem"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Нет/просрочен токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Конфликт (запись занята, дубликат, уже обработано и т.п.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/catalog/doctors/:id:
    get:
      tags:
        - catalog
      summary: Карточка врача (форма редактирования, 3.2)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Успех:"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorListItem"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Нет/просрочен токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags:
        - catalog
      summary: Редактировать врача
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDoctorRequest"
      responses:
        "200":
          description: "Успех:"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorListItem"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Нет/просрочен токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Конфликт (запись занята, дубликат, уже обработано и т.п.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/catalog/doctors/by-user/:userId:
    get:
      tags:
        - catalog
      summary: "Врач по Keycloak sub (9.1: идемпотентность саги, 9.3)"
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Успех:"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorListItem"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Нет/просрочен токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/catalog/doctors/me:
    get:
      tags:
        - catalog
      summary: "Карточка своего врача по токену (10.4: форма расписания)"
      parameters: [ ]
      responses:
        "200":
          description: "Успех:"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorListItem"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Нет/просрочен токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/catalog/doctors/me/schedule:
    put:
      tags:
        - catalog
      summary: "Расписание врача (10.4: врач правит своё, sub из токена)"
      parameters: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDoctorScheduleRequest"
      responses:
        "200":
          description: "Успех:"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorListItem"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Нет/просрочен токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Конфликт (запись занята, дубликат, уже обработано и т.п.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/catalog/specializations:
    get:
      tags:
        - catalog
      summary: Список специализаций
      parameters: [ ]
      responses:
        "200":
          description: "Успех:"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Specialization"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Нет/просрочен токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
        - catalog
      summary: Создать специализацию
      parameters: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSpecializationRequest"
      responses:
        "200":
          description: "Успех:"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Specialization"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Нет/просрочен токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Конфликт (запись занята, дубликат, уже обработано и т.п.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/catalog/specializations/:id:
    delete:
      tags:
        - catalog
      summary: Удалить свободную специализацию (занятая → 409)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Успех:"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Нет/просрочен токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    ApiError:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        field:
          type: string
          minLength: 1
        requestId:
          type: string
          minLength: 1
      required:
        - code
        - message
    PaginationQuery:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        offset:
          default: 0
          type: integer
          minimum: 0
          maximum: 9007199254740991
        limit:
          default: 20
          type: integer
          minimum: 1
          maximum: 100
    Ok:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        ok:
          type: boolean
          const: true
      required:
        - ok
    DoctorListResponse:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
              userId:
                anyOf:
                  - type: string
                    minLength: 1
                  - type: "null"
              firstName:
                type: string
                minLength: 1
              lastName:
                type: string
                minLength: 1
              middleName:
                type: string
                minLength: 1
              specializationId:
                type: string
                minLength: 1
              specializationName:
                type: string
                minLength: 1
              status:
                type: string
                enum:
                  - ACTIVE
                  - INACTIVE
              photoUrl:
                type: string
                format: uri
              schedule:
                type: object
                properties:
                  startTime:
                    type: string
                    pattern: ^\d{2}:\d{2}$
                  endTime:
                    type: string
                    pattern: ^\d{2}:\d{2}$
                  durationMinutes:
                    type: integer
                    minimum: 5
                    maximum: 30
                  workDays:
                    minItems: 1
                    type: array
                    items:
                      type: integer
                      minimum: 1
                      maximum: 7
                required:
                  - startTime
                  - endTime
                  - durationMinutes
                  - workDays
            required:
              - id
              - firstName
              - lastName
              - specializationId
              - specializationName
              - status
              - schedule
        total:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - items
        - total
    DoctorListQuery:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        offset:
          default: 0
          type: integer
          minimum: 0
          maximum: 9007199254740991
        limit:
          default: 20
          type: integer
          minimum: 1
          maximum: 100
        search:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
        specId:
          type: string
          minLength: 1
    DoctorListItem:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        id:
          type: string
          minLength: 1
        userId:
          anyOf:
            - type: string
              minLength: 1
            - type: "null"
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        middleName:
          type: string
          minLength: 1
        specializationId:
          type: string
          minLength: 1
        specializationName:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
        photoUrl:
          type: string
          format: uri
        schedule:
          type: object
          properties:
            startTime:
              type: string
              pattern: ^\d{2}:\d{2}$
            endTime:
              type: string
              pattern: ^\d{2}:\d{2}$
            durationMinutes:
              type: integer
              minimum: 5
              maximum: 30
            workDays:
              minItems: 1
              type: array
              items:
                type: integer
                minimum: 1
                maximum: 7
          required:
            - startTime
            - endTime
            - durationMinutes
            - workDays
      required:
        - id
        - firstName
        - lastName
        - specializationId
        - specializationName
        - status
        - schedule
    CreateDoctorRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        middleName:
          type: string
          minLength: 1
          maxLength: 100
        specializationId:
          type: string
          minLength: 1
        schedule:
          type: object
          properties:
            startTime:
              type: string
              pattern: ^\d{2}:\d{2}$
            endTime:
              type: string
              pattern: ^\d{2}:\d{2}$
            durationMinutes:
              type: integer
              minimum: 5
              maximum: 30
            workDays:
              minItems: 1
              type: array
              items:
                type: integer
                minimum: 1
                maximum: 7
          required:
            - startTime
            - endTime
            - durationMinutes
            - workDays
        userId:
          type: string
          minLength: 1
      required:
        - firstName
        - lastName
        - specializationId
        - schedule
    UpdateDoctorRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        middleName:
          type: string
          minLength: 1
          maxLength: 100
        specializationId:
          type: string
          minLength: 1
        schedule:
          type: object
          properties:
            startTime:
              type: string
              pattern: ^\d{2}:\d{2}$
            endTime:
              type: string
              pattern: ^\d{2}:\d{2}$
            durationMinutes:
              type: integer
              minimum: 5
              maximum: 30
            workDays:
              minItems: 1
              type: array
              items:
                type: integer
                minimum: 1
                maximum: 7
          required:
            - startTime
            - endTime
            - durationMinutes
            - workDays
        userId:
          type: string
          minLength: 1
        id:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
      required:
        - firstName
        - lastName
        - specializationId
        - schedule
    UpdateDoctorScheduleRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        schedule:
          type: object
          properties:
            startTime:
              type: string
              pattern: ^\d{2}:\d{2}$
            endTime:
              type: string
              pattern: ^\d{2}:\d{2}$
            durationMinutes:
              type: integer
              minimum: 5
              maximum: 30
            workDays:
              minItems: 1
              type: array
              items:
                type: integer
                minimum: 1
                maximum: 7
          required:
            - startTime
            - endTime
            - durationMinutes
            - workDays
      required:
        - schedule
    Specialization:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        doctorsCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - id
        - name
        - doctorsCount
    CreateSpecializationRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
      required:
        - name
