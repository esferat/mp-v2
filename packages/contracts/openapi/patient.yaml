openapi: 3.1.0
info:
  title: mp-v2 patient
  version: 0.1.0
  description: "Сгенерировано из Zod-схем packages/contracts. Перегенерация: pnpm
    gen. Сервис: patient, операций: 4."
paths:
  /api/patient/by-user/:userId:
    get:
      tags:
        - patient
      summary: Карточка пациента по Keycloak sub (сага/профиль)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Успех:"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Нет/просрочен токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/patient/:id:
    get:
      tags:
        - patient
      summary: "Карточка пациента по id (4.2: ADMIN или владелец)"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Успех:"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Нет/просрочен токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags:
        - patient
      summary: "Обновление карточки (4.2: ADMIN или владелец, id сверяется)"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePatientRequest"
      responses:
        "200":
          description: "Успех:"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Нет/просрочен токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Конфликт (запись занята, дубликат, уже обработано и т.п.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/patients:
    get:
      tags:
        - patient
      summary: Админский список пациентов с поиском и пагинацией (4.1)
      parameters:
        - name: offset
          in: query
          required: false
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            default: 0
            type: integer
            minimum: 0
            maximum: 9007199254740991
        - name: limit
          in: query
          required: false
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            default: 20
            type: integer
            minimum: 1
            maximum: 100
        - name: search
          in: query
          required: false
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: "Успех:"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientListResponse"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Нет/просрочен токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    ApiError:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        field:
          type: string
          minLength: 1
        requestId:
          type: string
          minLength: 1
      required:
        - code
        - message
    PaginationQuery:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        offset:
          default: 0
          type: integer
          minimum: 0
          maximum: 9007199254740991
        limit:
          default: 20
          type: integer
          minimum: 1
          maximum: 100
    Ok:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        ok:
          type: boolean
          const: true
      required:
        - ok
    Patient:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        id:
          type: string
          minLength: 1
        userId:
          type: string
          minLength: 1
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        middleName:
          type: string
          minLength: 1
        birthDate:
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
        email:
          type: string
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        registeredAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        photoUrl:
          type: string
          format: uri
      required:
        - id
        - userId
        - firstName
        - lastName
        - birthDate
        - email
        - registeredAt
    UpdatePatientRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        middleName:
          type: string
          minLength: 1
          maxLength: 100
        birthDate:
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
        id:
          type: string
          minLength: 1
      required:
        - email
        - firstName
        - lastName
        - birthDate
    PatientListResponse:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
              userId:
                type: string
                minLength: 1
              firstName:
                type: string
                minLength: 1
              lastName:
                type: string
                minLength: 1
              middleName:
                type: string
                minLength: 1
              birthDate:
                type: string
                format: date
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
              email:
                type: string
                format: email
                pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
              registrationDate:
                type: string
                format: date
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
              photoUrl:
                type: string
                format: uri
            required:
              - id
              - userId
              - firstName
              - lastName
              - birthDate
              - email
              - registrationDate
        total:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - items
        - total
    PatientListQuery:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        offset:
          default: 0
          type: integer
          minimum: 0
          maximum: 9007199254740991
        limit:
          default: 20
          type: integer
          minimum: 1
          maximum: 100
        search:
          type: string
          minLength: 1
          maxLength: 200
